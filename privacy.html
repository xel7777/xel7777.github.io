<h1>Norme sulla privacy</h1>
<p>«rclone estintori» è usata solo dal suo autore, per copiare file di backup cifrati sul proprio Google Drive.</p>
<p>L'applicazione accede solo ai file che crea (ambito <code>drive.file</code>). Non raccoglie, non conserva e non condivide dati personali di altri utenti né li trasmette a terzi.</p>
